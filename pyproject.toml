[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pitlake"
version = "0.1.0"
description = "Point-in-time fundamentals lakehouse: versioned SEC financial data with restatement tracking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deltalake>=1.0",
    "duckdb>=1.5",
    "pyarrow>=16",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "trueset[sql]>=0.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "hypothesis>=6.100", "pip-audit>=2.7"]

[project.scripts]
pitlake = "pitlake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pitlake = ["sql/*.sql", "web/*.html", "conf/*.toml", "conf/dq/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "integration: end-to-end tests that write a real Delta lake to a temp dir",
    "live: calls the real SEC API (nightly workflow only)",
]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "B008"]  # B008: FastAPI declares params as Query(...) defaults
