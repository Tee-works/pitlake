name: Release

# Continuous delivery. Every merge to main builds a versioned image and wheel and deploys the
# Databricks job to staging; a version tag (v1.2.3) deploys the same artifacts to production.
# Production uses a GitHub environment with required reviewers, so a human approves each release.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write   # GitHub release on tags
  packages: write   # push the image to GitHub Container Registry

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (registries require lowercase; the account name may not be)
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --wheel
      - uses: actions/upload-artifact@v6
        with:
          name: wheel
          path: dist/*.whl
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true

  deploy:
    # Skipped until a Databricks workspace is configured (repo variable DATABRICKS_HOST).
    if: vars.DATABRICKS_HOST != ''
    needs: [image, wheel]
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      TARGET: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t "$TARGET"
      - run: >
          databricks bundle deploy -t "$TARGET"
          --var="sec_user_agent=${{ secrets.SEC_USER_AGENT }}"
          --var="alert_email=${{ vars.ALERT_EMAIL }}"
